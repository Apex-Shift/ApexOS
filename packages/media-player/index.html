<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ApexOS Media Player</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #0d1219;
    color: #e0e6ed;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .toolbar {
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 10px 12px;
    background: #151e2c;
    border-bottom: 1px solid rgba(255,255,255,.08);
  }
  .toolbar button {
    background: #0066ff;
    border: none;
    color: #fff;
    border-radius: 6px;
    padding: 7px 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .toolbar button.secondary {
    background: #1a2435;
    border: 1px solid rgba(255,255,255,.1);
    color: #c5d0dc;
  }
  .toolbar span {
    font-size: 12px;
    color: #8a9aab;
    margin-left: auto;
    max-width: 45%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #05080f;
    min-height: 0;
  }
  video, audio {
    max-width: 100%;
    max-height: 100%;
  }
  video {
    width: 100%;
    height: 100%;
    background: #000;
  }
  .placeholder {
    text-align: center;
    color: #6a7a8a;
    padding: 24px;
  }
  .placeholder .big { font-size: 48px; margin-bottom: 12px; }
  .placeholder p { font-size: 13px; line-height: 1.5; }
  .controls {
    padding: 10px 14px;
    background: #111822;
    border-top: 1px solid rgba(255,255,255,.06);
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .controls input[type="range"] { flex: 1; }
  .controls .time { font-size: 11px; color: #8a9aab; font-family: monospace; min-width: 90px; text-align: center; }
</style>
</head>
<body>
  <div class="toolbar">
    <button id="btn-open">Open file</button>
    <button class="secondary" id="btn-demo-audio">Demo audio</button>
    <button class="secondary" id="btn-demo-video">Demo video</button>
    <span id="filename">No media loaded</span>
    <input type="file" id="file" accept="audio/*,video/*" hidden>
  </div>
  <div class="stage" id="stage">
    <div class="placeholder" id="placeholder">
      <div class="big">🎬</div>
      <p><strong>ApexOS Media Player</strong><br>
      Open a local audio or video file, or try a demo stream.</p>
    </div>
  </div>
  <div class="controls">
    <button class="secondary" id="btn-play" style="background:#1a2435;border:1px solid rgba(255,255,255,.1);color:#c5d0dc;border-radius:6px;padding:6px 10px;cursor:pointer;">Play</button>
    <span class="time" id="time">0:00 / 0:00</span>
    <input type="range" id="seek" min="0" max="1000" value="0">
    <input type="range" id="vol" min="0" max="1" step="0.05" value="1" style="max-width:90px" title="Volume">
  </div>
<script>
(function () {
  const stage = document.getElementById("stage");
  const placeholder = document.getElementById("placeholder");
  const fileInput = document.getElementById("file");
  const filename = document.getElementById("filename");
  const seek = document.getElementById("seek");
  const vol = document.getElementById("vol");
  const timeEl = document.getElementById("time");
  const btnPlay = document.getElementById("btn-play");
  let media = null;
  let objectUrl = null;

  function fmt(s) {
    if (!isFinite(s)) return "0:00";
    s = Math.floor(s);
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return m + ":" + String(sec).padStart(2, "0");
  }

  function clearMedia() {
    if (media) {
      media.pause();
      media.removeAttribute("src");
      media.load();
      media.remove();
      media = null;
    }
    if (objectUrl) {
      URL.revokeObjectURL(objectUrl);
      objectUrl = null;
    }
    stage.innerHTML = "";
    stage.appendChild(placeholder);
    placeholder.style.display = "block";
  }

  function bindMedia(el, label) {
    clearMedia();
    placeholder.style.display = "none";
    media = el;
    stage.appendChild(el);
    filename.textContent = label;
    el.volume = parseFloat(vol.value);
    el.ontimeupdate = () => {
      if (!el.duration) return;
      seek.value = Math.floor((el.currentTime / el.duration) * 1000);
      timeEl.textContent = fmt(el.currentTime) + " / " + fmt(el.duration);
    };
    el.onended = () => { btnPlay.textContent = "Play"; };
    el.onplay = () => { btnPlay.textContent = "Pause"; };
    el.onpause = () => { btnPlay.textContent = "Play"; };
    el.play().catch(() => {});
  }

  function openFile(file) {
    if (!file) return;
    const url = URL.createObjectURL(file);
    objectUrl = url;
    if (file.type.startsWith("video/") || /\.(mp4|webm|ogg|mov)$/i.test(file.name)) {
      const v = document.createElement("video");
      v.src = url;
      v.controls = false;
      bindMedia(v, file.name);
    } else {
      const a = document.createElement("audio");
      a.src = url;
      a.controls = false;
      a.style.width = "80%";
      bindMedia(a, file.name);
    }
  }

  document.getElementById("btn-open").onclick = () => fileInput.click();
  fileInput.onchange = () => openFile(fileInput.files[0]);

  document.getElementById("btn-demo-audio").onclick = () => {
    const a = document.createElement("audio");
    // Short public domain / sample tone via data is heavy; use a well-known test stream
    a.src = "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3";
    bindMedia(a, "Demo: SoundHelix Song 1");
  };

  document.getElementById("btn-demo-video").onclick = () => {
    const v = document.createElement("video");
    v.src = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4";
    bindMedia(v, "Demo: Big Buck Bunny");
  };

  btnPlay.onclick = () => {
    if (!media) return;
    if (media.paused) media.play(); else media.pause();
  };

  seek.oninput = () => {
    if (!media || !media.duration) return;
    media.currentTime = (seek.value / 1000) * media.duration;
  };

  vol.oninput = () => {
    if (media) media.volume = parseFloat(vol.value);
  };
})();
</script>
</body>
</html>
